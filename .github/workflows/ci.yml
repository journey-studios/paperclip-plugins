name: Plugin checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: evolution-test-only
          POSTGRES_DB: evolution_merge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d evolution_merge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:evolution-test-only@127.0.0.1:5432/evolution_merge_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - run: pnpm bootstrap:host
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm run package
      - name: Build native S3 bridge image
        run: docker build -f services/s3-storage-bridge/Dockerfile -t paperclip-s3-storage-bridge:ci .
      - uses: ./.github/actions/secret-scan

  storage-collector-node22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.0
      - run: node --check services/storage-collector/src/lib.mjs
      - run: node --check services/storage-collector/src/collect.mjs
      - run: node --test services/storage-collector/test/*.test.mjs
