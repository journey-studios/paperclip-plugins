# Drop-in for hosts that keep Paperclip data in bind mounts under /srv (Contabo VPS).
# Install as /etc/systemd/system/paperclip-storage-collector.service.d/srv-layout.conf and copy
# srv-directories.json to /etc/paperclip-storage-manager.directories.json (root-owned, mode 0644).
[Service]
Environment=VPS_STATUS_DIRECTORIES_FILE=/etc/paperclip-storage-manager.directories.json
Environment=STORAGE_OUTPUT_DIR=/srv/data/storage-manager
# The directory is already bind-mounted read-only into the app container as /run/paperclip-storage.
# ReadWritePaths is additive: clear the base unit's path, which does not exist on this host and makes
# the namespace setup fail (status 226/NAMESPACE).
ReadWritePaths=
ReadWritePaths=/srv/data/storage-manager
# Node is installed outside the distro packages on this host; clear the base ExecStart before overriding.
ExecStart=
ExecStart=/opt/node/bin/node /opt/paperclip-storage-collector/src/collect.mjs
